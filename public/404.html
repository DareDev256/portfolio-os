<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | James Olusoga</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-system.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@400;700&family=Saira:wdth,wght@50..125,100..900&display=swap" rel="stylesheet" />

    <style>
        :root {
            --sys-ground: #04080f;
            --sys-cyan: #6fd3ff;
            --sys-gold: #ffd76a;
            --sys-text: #d9f2ff;
            --sys-muted: #7fa8c9;
            --sys-hair: rgba(90, 190, 255, 0.22);
            --sys-display: 'Saira', 'Barlow Condensed', 'Arial Narrow', sans-serif;
            --sys-prose: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --sys-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--sys-ground);
            color: var(--sys-text);
            font-family: var(--sys-prose);
            padding: 24px;
        }

        .nf {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        .nf-code {
            font-family: var(--sys-mono);
            font-size: 13px;
            letter-spacing: 0.18em;
            color: var(--sys-cyan);
            text-transform: uppercase;
            margin: 0 0 18px;
        }

        .nf-title {
            font-family: var(--sys-display);
            font-variation-settings: 'wdth' 100, 'wght' 600;
            font-size: clamp(48px, 12vw, 96px);
            line-height: 1;
            margin: 0 0 20px;
            color: #fff;
        }

        .nf-copy {
            font-size: 16px;
            line-height: 1.5;
            color: var(--sys-muted);
            margin: 0 0 36px;
        }

        .nf-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nf-btn {
            font-family: var(--sys-mono);
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 13px 24px;
            border: 1px solid var(--sys-hair);
            color: var(--sys-text);
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .nf-btn:hover,
        .nf-btn:focus-visible {
            border-color: var(--sys-cyan);
            color: var(--sys-cyan);
        }

        .nf-btn.primary {
            border-color: var(--sys-gold);
            color: var(--sys-gold);
        }

        .nf-btn.primary:hover,
        .nf-btn.primary:focus-visible {
            background: var(--sys-gold);
            color: var(--sys-ground);
        }
    </style>
</head>

<body>
    <div class="nf">
        <p class="nf-code">404 // NOT FOUND</p>
        <h1 class="nf-title">Dead link.</h1>
        <p class="nf-copy">That page does not exist on this system — check the address, or head back to the work.</p>
        <div class="nf-actions">
            <a class="nf-btn primary" href="/">BACK HOME</a>
            <a class="nf-btn" href="/#contact">CONTACT</a>
            <a class="nf-btn" href="https://wa.me/@JamesOD6" rel="noopener">WHATSAPP</a>
        </div>
    </div>
</body>

</html>
