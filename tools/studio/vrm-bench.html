<!doctype html>
<!--
  vrm-bench.html: dev-only bench for a VRM character (VRoid Studio export or a
  commission) on the throne, in MToon, the anime shader VRM ships with (4.72.2).
  Not a Vite build entry, so it never ships. Run `npx vite`, open
  /tools/studio/vrm-bench.html?src=<url of a .vrm>&view=bust&ink=violet
  A route-in from Playwright is how a local file is served.
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRM bench</title>
    <style>
        html, body { margin: 0; height: 100%; background: #dcdbe3; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #tag { position: fixed; left: 14px; top: 12px; font: 600 13px/1.2 ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #101014; }
    </style>
    <script type="importmap">
        { "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"
        } }
    </script>
</head>
<body>
    <canvas id="gl"></canvas>
    <div id="tag"></div>
    <script type="module">
        // full URLs here (Vite's dev server rewrites bare imports in inline scripts);
        // the import map above resolves the bare 'three' inside the CDN modules to the same file
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js';

        const q = new URLSearchParams(location.search);
        const view = q.get('view') || 'bust';
        document.getElementById('tag').textContent = q.get('tag') || '';
        const canvas = document.getElementById('gl');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(2, devicePixelRatio));
        renderer.setSize(innerWidth, innerHeight, false);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdcdbe3);
        const key = new THREE.DirectionalLight(0xffffff, 2.2);
        key.position.set(1.5, 3, 4);
        scene.add(key, new THREE.AmbientLight(0xffffff, 0.5));
        const back = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.4, 0.12), new THREE.MeshStandardMaterial({ color: 0x15151b, roughness: 0.6 }));
        back.position.set(0, 1.1, -0.5);
        const seat = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.45, 0.9), new THREE.MeshStandardMaterial({ color: 0x1b1b22, roughness: 0.6 }));
        seat.position.set(0, 0.225, -0.05);
        scene.add(back, seat);

        const loader = new GLTFLoader();
        loader.register((p) => new VRMLoaderPlugin(p));
        const gltf = await loader.loadAsync(q.get('src'));
        const vrm = gltf.userData.vrm;
        VRMUtils.rotateVRM0(vrm);
        scene.add(vrm.scene);

        // seated forward, forearms on the knees: the Monarch's pose, on the normalized humanoid
        const b = (n) => vrm.humanoid.getNormalizedBoneNode(n);
        const hipsY = b('hips').getWorldPosition(new THREE.Vector3()).y;
        vrm.scene.position.y = 0.47 - hipsY + 0.05;
        b('spine').rotation.x = 0.28;
        b('chest').rotation.x = 0.22;
        b('upperChest')?.rotation.set(0.1, 0, 0);
        b('neck').rotation.x = -0.12;
        b('head').rotation.x = 0.05;
        for (const [s, sx] of [['left', 1], ['right', -1]]) {
            b(`${s}UpperLeg`).rotation.set(-1.45, 0, -sx * 0.16);
            b(`${s}LowerLeg`).rotation.set(1.5, 0, 0);
            b(`${s}Foot`).rotation.set(-0.1, 0, 0);
            b(`${s}UpperArm`).rotation.set(0, sx * -0.55, sx * -1.05);
            b(`${s}LowerArm`).rotation.set(0, sx * -1.45, 0);
            b(`${s}Hand`).rotation.set(0, 0, sx * 0.2);
        }
        vrm.update(0);

        if (q.get('ink') === 'violet') {
            vrm.scene.traverse((o) => {
                for (const m of [].concat(o.material || [])) {
                    if (!m.isMToonMaterial) continue;
                    if (m.outlineColorFactor) m.outlineColorFactor.set(0x9a7bff);
                    if (m.parametricRimColorFactor) m.parametricRimColorFactor.set(0x7a5bdf);
                    m.parametricRimFresnelPowerFactor = 3;
                }
            });
        }
        const VIEWS = {
            bust: { pos: [0.3, 1.0, 1.25], at: [0, 0.92, 0.12], fov: 30 },
            full: { pos: [1.0, 1.0, 3.1], at: [0, 0.6, 0.2], fov: 34 },
        };
        const v = VIEWS[view] || VIEWS.bust;
        const camera = new THREE.PerspectiveCamera(v.fov, innerWidth / innerHeight, 0.05, 50);
        camera.position.fromArray(v.pos);
        camera.lookAt(new THREE.Vector3(...v.at));
        renderer.render(scene, camera);
        window.__bench = { ready: true, meta: vrm.meta?.name || vrm.meta?.title || '' };
    </script>
</body>
</html>
